[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zero-exposure-safety-bench"
version = "0.1.0"
description = "Zero-exposure multimodal safety benchmark for graphic violence and child abuse detection cascades"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mark Colley" }]
requires-python = ">=3.12"
urls = { Homepage = "https://github.com/M-Colley/zero-exposure-safety-bench", Repository = "https://github.com/M-Colley/zero-exposure-safety-bench", Issues = "https://github.com/M-Colley/zero-exposure-safety-bench/issues" }
dependencies = [
    "pydantic>=2.12",
    "pyyaml>=6.0.2",
    "numpy>=2.2",
    "Pillow>=12.0",
    "opencv-python-headless>=5.0",
    "scenedetect>=0.7.2",
    "ImageHash>=4.3.2",
    "pdqhash>=0.2.8",
    "openai>=2.0",
    "httpx>=0.28.1",
    "scikit-learn>=1.8",
    "typer>=0.20",
]

[project.optional-dependencies]
inspect = ["inspect-ai>=0.3.200"]
linux-vpdq = ["vpdq>=0.2.5 ; sys_platform == 'linux'"]

[project.scripts]
zesb = "zesb.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.15",
    "mypy>=2.0",
    "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zesb"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pdqhash",
    "cv2",
    "cv2.*",
    "imagehash",
    "scenedetect",
    "sklearn.metrics",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
